{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Cars</title>
  <link rel="stylesheet" href="{% static 'cars/vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'cars/app.css' %}?v=8">
  <script src="{% static 'cars/app.js' %}?v=3" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header"><div class="app-container header-inner"><a class="brand" href="{{ return_url }}">Cars</a></div></header>
  <main id="main-content" class="app-container main-content" tabindex="-1">
    {% if messages %}
      <div class="messages" aria-live="polite" aria-atomic="true">
        {% for message in messages %}<div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}" role="status">{{ message }}</div>{% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <dialog id="edit-car-modal" class="edit-modal" aria-labelledby="edit-modal-title">
    <div class="edit-modal-header"><h2 id="edit-modal-title">Edit car</h2><button class="modal-close" type="button" aria-label="Close edit form" data-close-modal>&times;</button></div>
    <p class="alert alert-danger" role="alert" data-modal-notice hidden></p>
    <div data-modal-body></div>
  </dialog>
</body>
</html>
